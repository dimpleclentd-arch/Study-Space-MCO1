
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Study Space</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My Study Space 🎀</h1>
        <p>Your Personal Student Dashboard</p>

        <hr>

        <h2>Welcome, Student! 💗</h2>
        <p>Stay organized and enjoy studying!</p>

        <h3>📚 Study Tools</h3>

        <div class="tools">

            <div class="tool">
                <h3>📅 Class Schedule</h3>
                <p>Organize your classes.</p>
            </div>

            <div class="tool">
                <h3>📝 To-Do List</h3>
                <p>Keep track of your tasks.</p>
            </div>

            <div class="tool">
                <h3>⏰ Study Timer</h3>
                <p>Manage your study time.</p>
            </div>

            <div class="tool">
                <h3>🧮 Grade Calculator</h3>
                <p>Check your grades.</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
